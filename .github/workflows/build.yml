name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache GeckoView AAR
        id: cache-geckoview
        uses: actions/cache@v4
        with:
          path: .cache/geckoview
          key: geckoview-135.0.20240916

      - name: Download GeckoView AAR
        if: steps.cache-geckoview.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/geckoview
          curl -L -o .cache/geckoview/geckoview.aar \
            "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/135.0.20240916/geckoview-135.0.20240916.aar"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
