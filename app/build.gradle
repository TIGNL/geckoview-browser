plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.geckobrowser'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.geckobrowser"
        minSdk 26
        targetSdk 36

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            def keystoreB64 = System.getenv("KEYSTORE_BASE64")
            if (keystoreB64) {
                def keystoreFile = file("${buildDir}/release.keystore")
                keystoreFile.bytes = keystoreB64.decodeBase64()
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.mozilla.geckoview:geckoview-arm64-v8a:153.0.20260730155536'
}
